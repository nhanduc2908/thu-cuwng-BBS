<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176344">
  <meta name="description" content="Danh mục sản phẩm Bông Bông Pet Care.">
  <title>Sản phẩm | Bông Bông Pet Care</title>
  <link rel="stylesheet" href="styles/store.css">
  <script src="scripts/store.js" defer></script>
</head>
<body data-page="catalog" data-catalog="all">
  <header id="store-header" class="site-header"></header>
  <main class="container">
    <p class="breadcrumbs"><a href="index.html">Trang chủ</a> / Sản phẩm</p>
    <h1 class="page-title">Danh mục sản phẩm</h1>
    <p class="page-lead">Tìm thức ăn và phụ kiện theo từ khóa, loài hoặc nhóm hàng. Nhãn dữ liệu trên từng sản phẩm cho biết trạng thái xác minh.</p>
    <div class="catalog-toolbar" role="search">
      <input id="catalog-search" type="search" placeholder="Tìm tên, thương hiệu hoặc nhóm hàng" aria-label="Tìm sản phẩm">
      <select id="catalog-category" aria-label="Lọc theo nhóm hàng"><option value="">Mọi nhóm hàng</option></select>
      <select id="catalog-species" aria-label="Lọc theo loài"><option value="">Mọi loài</option><option value="DOG">Chó</option><option value="CAT">Mèo</option><option value="Chó, Mèo">Chó & mèo</option><option value="Cá">Cá</option><option value="Bò sát">Bò sát</option><option value="Hamster, Thỏ">Hamster & thỏ</option></select>
      <select id="catalog-sort" aria-label="Sắp xếp sản phẩm">
        <option value="popular">Xu hướng 30 ngày</option>
        <option value="price-asc">Giá thấp đến cao</option>
        <option value="price-desc">Giá cao đến thấp</option>
        <option value="stock">Còn hàng trước</option>
        <option value="name">Tên A–Z</option>
      </select>
    </div>
    <p class="sort-status" data-sort-status role="status"></p>
    <p class="product-meta" data-product-count aria-live="polite"></p>
    <div class="product-grid" data-product-grid></div>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><div><strong>BÔNG BÔNG PET CARE</strong><p><a href="index.html">Quay về trang chủ</a></p></div><p>Gửi yêu cầu sản phẩm; chưa tạo đơn bán hay thanh toán.</p></div></footer>
  <div id="store-toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
