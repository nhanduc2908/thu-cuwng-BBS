<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bản mô phỏng giao diện PetCare desktop, có thể chuyển phân hệ và tìm trong dữ liệu minh họa.">
  <title>PetCare | Interactive Interface Preview</title>
  <style>
    :root { color-scheme: light; --ink:#17231f; --muted:#65736d; --paper:#f2f5f1; --surface:#fff; --line:#dce4de; --green:#176b4d; --green-dark:#0c4a35; --coral:#dc7356; --blue:#3f79a8; --amber:#ba8433; --shadow:0 14px 38px rgba(26,54,40,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.5 "Trebuchet MS","Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    a { color:inherit; text-decoration:none; }
    .site-bar { height:58px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 22px; border-bottom:1px solid var(--line); background:var(--surface); }
    .site-brand { display:inline-flex; align-items:center; gap:10px; min-width:0; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .brand-mark { width:30px; height:30px; display:grid; flex:0 0 auto; place-items:center; border-radius:9px 9px 9px 3px; color:#fff; background:var(--green); }
    .site-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; }
    .site-link { color:var(--muted); font-size:12px; }
    .site-link:hover { color:var(--green); }
    .lang-toggle { min-width:42px; height:34px; border:1px solid var(--line); border-radius:5px; color:var(--ink); background:#fff; font-weight:700; cursor:pointer; }
    .preview-shell { width:min(1500px,calc(100% - 32px)); min-height:calc(100vh - 82px); display:grid; grid-template-columns:238px minmax(0,1fr); margin:12px auto 18px; overflow:hidden; border:1px solid #d9e2db; border-radius:8px; background:var(--surface); box-shadow:var(--shadow); }
    .sidebar { display:flex; min-width:0; flex-direction:column; padding:18px 12px; color:#e7f2e9; background:var(--green-dark); }
    .workspace-label { padding:2px 10px 14px; border-bottom:1px solid rgba(255,255,255,.15); }
    .workspace-label strong { display:block; font-size:14px; }
    .workspace-label span { display:block; margin-top:3px; color:#b9d0c0; font-size:11px; }
    .nav-caption { margin:17px 10px 7px; color:#9fbeaa; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .nav-group-label { margin:13px 10px 4px; color:#9fbeaa; font-size:9px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .nav-group-label:first-child { margin-top:8px; }
    .module-nav { display:grid; gap:3px; }
    .module-nav button { width:100%; min-height:36px; display:flex; align-items:center; gap:10px; padding:7px 9px; border:0; border-radius:4px; color:#d8e8dc; text-align:left; background:transparent; cursor:pointer; }
    .module-nav button:hover { background:rgba(255,255,255,.09); }
    .module-nav button[aria-current="page"] { color:#173b2b; background:#c9ef72; font-weight:700; }
    .nav-index { width:23px; flex:0 0 23px; color:#93b5a0; font-size:10px; font-variant-numeric:tabular-nums; }
    .module-nav button[aria-current="page"] .nav-index { color:var(--green-dark); }
    .nav-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .sidebar-foot { margin-top:auto; padding:15px 10px 0; border-top:1px solid rgba(255,255,255,.15); color:#b9d0c0; font-size:11px; }
    .sidebar-foot strong { display:block; margin-bottom:4px; color:#f1f7ed; font-size:12px; }
    .workspace { min-width:0; }
    .workspace-top { min-height:62px; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 22px; border-bottom:1px solid var(--line); background:#fff; }
    .crumb { color:var(--muted); font-size:12px; }
    .crumb strong { color:var(--ink); }
    .top-controls { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .search-box,.status-filter { height:36px; padding:0 10px; border:1px solid var(--line); border-radius:5px; outline:none; background:#fbfcfa; }
    .search-box { width:min(250px,26vw); }
    .status-filter { max-width:170px; color:var(--ink); font-size:12px; }
    .search-box:focus,.status-filter:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,77,.1); }
    .demo-flag { padding:6px 9px; border:1px solid #efd1c5; border-radius:4px; color:#a64f39; background:#fff3ee; font-size:10px; font-weight:800; letter-spacing:.07em; white-space:nowrap; }
    .screen-content { padding:25px clamp(16px,3vw,34px) 30px; }
    .screen-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .screen-kicker { color:var(--green); font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
    h1 { margin:5px 0 4px; font:600 clamp(27px,3vw,38px)/1.15 "Segoe UI",Tahoma,sans-serif; }
    .screen-description { max-width:680px; margin:0; color:var(--muted); font-size:13px; }
    .screen-meta { color:var(--muted); font-size:11px; white-space:nowrap; }
    .demo-note { display:flex; align-items:flex-start; gap:9px; margin:0 0 17px; padding:10px 12px; border-left:3px solid var(--coral); color:#69483d; background:#fff5f0; font-size:11px; }
    .demo-note strong { color:#9e5039; }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:20px; }
    .metric { min-width:0; padding:14px 15px; border:1px solid var(--line); border-radius:5px; background:#fff; }
    .metric-label { color:var(--muted); font-size:11px; }
    .metric-value { display:block; margin-top:6px; color:var(--green-dark); font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; }
    .metric-foot { color:var(--muted); font-size:10px; }
    .content-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(220px,.8fr); gap:14px; align-items:start; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .section-head h2 { margin:0; font-size:14px; }
    .section-head span { color:var(--muted); font-size:11px; }
    .data-section { min-width:0; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:5px; background:#fff; }
    #record-rows tr { cursor:pointer; }
    #record-rows tr[aria-selected="true"] { background:#e8f3ea; }
    table { width:100%; border-collapse:collapse; text-align:left; }
    th,td { padding:11px 12px; border-bottom:1px solid #e9eeea; vertical-align:middle; }
    th { color:var(--muted); background:#f6f8f5; font-size:10px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
    td { font-size:12px; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#f5faf6; }
    .record-id { color:var(--green); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .side-section { padding:15px; border:1px solid var(--line); border-radius:5px; background:#fff; }
    .detail-card { margin-top:14px; padding:15px; border:1px solid var(--line); border-radius:5px; background:#f8faf7; }
    .detail-card[hidden] { display:none; }
    .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .detail-field { min-width:0; padding:9px; border:1px solid var(--line); border-radius:4px; background:#fff; }
    .detail-field dt { color:var(--muted); font-size:10px; }
    .detail-field dd { margin:3px 0 0; overflow-wrap:anywhere; font-size:12px; font-weight:700; }
    .detail-actions { display:flex; gap:8px; margin-top:12px; }
    .detail-action { min-height:34px; padding:6px 10px; border:1px solid var(--line); border-radius:4px; color:var(--green); background:#fff; font-size:11px; cursor:pointer; }
    .detail-action:hover { border-color:var(--green); }
    .activity-list { display:grid; }
    .activity-item { display:grid; grid-template-columns:8px minmax(0,1fr); gap:10px; padding:11px 0; border-top:1px solid #edf0ed; }
    .activity-dot { width:7px; height:7px; margin-top:5px; border-radius:50%; background:var(--coral); }
    .activity-item p { margin:0; font-size:11px; }
    .activity-item small { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
    .empty-state { padding:30px 14px; color:var(--muted); text-align:center; }
    .empty-state[hidden],.table-wrap[hidden] { display:none; }
    .screen-footer { display:flex; justify-content:space-between; gap:12px; margin-top:22px; padding-top:13px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; }
    [data-lang="en"] { display:none; }
    body.show-en [data-lang="vi"] { display:none; }
    body.show-en [data-lang="en"] { display:initial; }
    @media (max-width:980px) { .preview-shell { grid-template-columns:190px minmax(0,1fr); } .module-nav button { padding-inline:7px; } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .content-grid { grid-template-columns:1fr; } }
    @media (max-width:680px) {
      .site-bar { height:52px; padding:0 12px; }
      .site-link { display:none; }
      .preview-shell { width:100%; min-height:calc(100vh - 52px); display:flex; flex-direction:column; margin:0; border:0; border-radius:0; }
      .sidebar { padding:10px; }
      .workspace-label,.nav-caption,.sidebar-foot { display:none; }
      .module-nav { display:flex; overflow-x:auto; gap:5px; padding:1px 0 3px; scrollbar-width:thin; }
      .module-nav button { width:auto; min-width:max-content; min-height:36px; padding:7px 10px; }
      .nav-index { width:auto; flex-basis:auto; }
      .workspace-top { min-height:56px; padding:9px 12px; }
      .crumb { display:none; }
      .top-controls { width:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(110px,.6fr); }
      .search-box,.status-filter { width:100%; min-width:0; max-width:none; }
      .demo-flag { grid-column:1 / -1; justify-self:start; }
      .screen-content { padding:20px 12px; }
      .screen-head { align-items:flex-start; flex-direction:column; gap:5px; }
      .screen-meta { white-space:normal; }
      .metrics { gap:7px; }
      .detail-grid { grid-template-columns:1fr 1fr; }
      .metric { padding:11px; }
      .metric-value { font-size:21px; }
      th,td { padding:9px 8px; }
      .screen-footer { flex-direction:column; }
    }
    @media (max-width:380px) { .site-brand { font-size:10px; } .metrics { grid-template-columns:1fr 1fr; } .demo-flag { padding-inline:6px; font-size:9px; } .table-wrap table { min-width:560px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
</head>

    };
    let englishMode=false;
    let activeScreen='dashboard';
    const nav=document.getElementById('module-nav');
    const content=document.getElementById('screen-content');
    const search=document.getElementById('record-search');
    const statusFilter=document.getElementById('status-filter');
    const tr=(pair)=>pair[englishMode?1:0];
    const escapeHtml=(value)=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    const normalize=(value)=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
    function renderNavigation(){
      let routeIndex=0;
      nav.innerHTML=navigationGroups.map((group)=>`<div class="nav-group-label" data-group="${group.id}">${escapeHtml(tr([group.vi,group.en]))}</div>${group.routes.map((route)=>{const module=modules.find((item)=>item.id===route);routeIndex+=1;return `<button type="button" data-screen="${module.id}" aria-current="${module.id===activeScreen?'page':'false'}"><span class="nav-index">${String(routeIndex).padStart(2,'0')}</span><span class="nav-name">${escapeHtml(tr([module.vi,module.en]))}</span></button>`;}).join('')}`).join('');
      nav.querySelectorAll('[data-screen]').forEach((button)=>button.addEventListener('click',()=>{activeScreen=button.dataset.screen;search.value='';statusFilter.value='all';renderScreen();}));
    }
    function renderScreen(){
      const screen=screens[activeScreen];
      const module=modules.find((item)=>item.id===activeScreen);
      document.getElementById('breadcrumb-title').textContent=tr(module?[module.vi,module.en]:screen.title);
      const metricHtml=screen.metrics?`<div class="metrics">${screen.metrics.map((metric)=>`<div class="metric"><span class="metric-label">${escapeHtml(tr(metric.label))}</span><strong class="metric-value">${escapeHtml(metric.value)}</strong><span class="metric-foot">${escapeHtml(tr(metric.foot))}</span></div>`).join('')}</div>`:'';
      const statuses=[...new Map(screen.rows.map((row)=>[row.at(-1)[0],row.at(-1)])).values()];
      const filterColumn=screen.columns.at(-1);
      statusFilter.innerHTML=`<option value="all">${escapeHtml(tr(['Tất cả · '+filterColumn[0],'All · '+filterColumn[1]]))}</option>${statuses.map((status,index)=>`<option value="${index}">${escapeHtml(tr(status))}</option>`).join('')}`;
      statusFilter.setAttribute('aria-label',tr(['Lọc theo '+filterColumn[0],'Filter by '+filterColumn[1]]));
      content.innerHTML=`<div class="screen-head"><div><span class="screen-kicker">PetCare / ${escapeHtml(tr(module?[module.vi,module.en]:screen.title))}</span><h1>${escapeHtml(tr(screen.title))}</h1><p class="screen-description">${escapeHtml(tr(screen.desc))}</p></div><span class="screen-meta">${escapeHtml(tr(['Màn hình minh họa','Illustrative screen']))}</span></div>
        <p class="demo-note"><span aria-hidden="true">●</span><span><strong>${escapeHtml(tr(['Chế độ xem trước','Preview mode']))}</strong> · ${escapeHtml(tr(['Tên, mã, trạng thái và số liệu trên màn hình đều là dữ liệu mẫu. Thao tác không ghi vào SQLite.','Names, IDs, statuses and figures are sample data. Actions do not write to SQLite.']))}</span></p>${metricHtml}
        <div class="content-grid"><section class="data-section"><div class="section-head"><h2>${escapeHtml(tr(['Bản ghi gần đây','Recent records']))}</h2><span id="visible-count"></span></div><div class="table-wrap" id="table-wrap"><table><thead><tr>${screen.columns.map((column)=>`<th>${escapeHtml(tr(column))}</th>`).join('')}</tr></thead><tbody id="record-rows"></tbody></table></div><div class="empty-state" id="empty-state" hidden>${escapeHtml(tr(['Không tìm thấy bản ghi phù hợp.','No matching records.']))}</div></section>
        <aside><section class="side-section"><div class="section-head"><h2>${escapeHtml(tr(['Ghi chú vận hành','Operations note']))}</h2><span>${escapeHtml(tr(['Mẫu','Sample']))}</span></div><div class="activity-list"><div class="activity-item"><span class="activity-dot"></span><p>${escapeHtml(tr(['Dữ liệu được nhập và xác nhận bởi nhân viên.','Records are entered and confirmed by staff.']))}<small>${escapeHtml(tr(['Quy trình nội bộ','Internal workflow']))}</small></p></div><div class="activity-item"><span class="activity-dot" style="background:var(--blue)"></span><p>${escapeHtml(tr(['Kiểm tra liên kết hồ sơ trước khi cập nhật.','Check linked records before updating.']))}<small>${escapeHtml(tr(['Kiểm soát dữ liệu','Data control']))}</small></p></div><div class="activity-item"><span class="activity-dot" style="background:var(--amber)"></span><p>${escapeHtml(tr(['Sao lưu định kỳ cần được thực hiện theo quy trình riêng.','Regular backups should follow a separate procedure.']))}<small>SQLite · Local</small></p></div></div></section>
        <section class="detail-card" id="record-detail" aria-live="polite" hidden><div class="section-head"><h2>${escapeHtml(tr(['Chi tiết bản ghi mẫu','Sample record detail']))}</h2><button class="detail-action" id="close-detail" type="button">×</button></div><p id="detail-intro"></p><dl class="detail-grid" id="detail-fields"></dl><div class="detail-actions"><button class="detail-action" id="detail-related" type="button">${escapeHtml(tr(['Xem mục liên quan','View related item']))}</button></div><p class="metric-foot">${escapeHtml(tr(['Chỉ thay đổi nội dung xem trước; không tạo hoặc sửa dữ liệu ứng dụng.','Preview only; no application data is created or changed.']))}</p></section></aside></div>
        <footer class="screen-footer"><span>${escapeHtml(tr(['PetCare chạy cục bộ trên Windows · Python + PySide6 + SQLite','PetCare runs locally on Windows · Python + PySide6 + SQLite']))}</span><span>${escapeHtml(tr(['Bản mô phỏng giao diện, không phải ứng dụng đang hoạt động','Interface prototype, not a running application']))}</span></footer>`;
      renderRows();
      renderNavigation();
      document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('record-detail').hidden=true);
      document.getElementById('detail-related').addEventListener('click',()=>{
        const related=activeScreen==='customers'?'customer_insights':activeScreen==='pets'?'pet_detail':activeScreen==='pet_detail'?'pets':activeScreen==='customer_insights'?'customers':null;
        if(related){activeScreen=related;search.value='';statusFilter.value='all';renderScreen();}
      });
    }
    function renderRows(){
      const screen=screens[activeScreen];
      const query=normalize(search.value.trim());
      const selectedStatus=statusFilter.value;
      const rows=screen.rows.map((row,index)=>({row,index})).filter(({row})=>normalize(row.flat().join(' ')).includes(query)&&(selectedStatus==='all'||String([...new Map(screen.rows.map((record)=>[record.at(-1)[0],record.at(-1)])).values()].findIndex((status)=>status[0]===row.at(-1)[0]))===selectedStatus));
      document.getElementById('record-rows').innerHTML=rows.map(({row,index})=>`<tr data-row="${index}" tabindex="0" aria-label="${escapeHtml(tr(['Xem chi tiết','View details']))}: ${escapeHtml(tr(row[0]))}" aria-selected="false">${row.map((column,columnIndex)=>`<td>${columnIndex===0?`<span class="record-id">${escapeHtml(tr(column))}</span>`:escapeHtml(tr(column))}</td>`).join('')}</tr>`).join('');
      document.getElementById('table-wrap').hidden=rows.length===0;
      document.getElementById('empty-state').hidden=rows.length!==0;
      document.getElementById('visible-count').textContent=rows.length+' / '+screen.rows.length+' '+tr(['bản ghi mẫu','sample records']);
      document.querySelectorAll('#record-rows tr').forEach((rowElement)=>{
        const open=()=>showRecordDetail(screen,screen.rows[Number(rowElement.dataset.row)],rowElement);
        rowElement.addEventListener('click',open);
        rowElement.addEventListener('keydown',(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}});
      });
      document.getElementById('record-detail').hidden=true;
    }
    function showRecordDetail(screen,row,selectedRow){
      document.querySelectorAll('#record-rows tr').forEach((item)=>item.setAttribute('aria-selected',String(item===selectedRow)));
      document.getElementById('detail-intro').textContent=tr(['Mẫu minh họa trong phân hệ: '+tr(screen.title)+'.','Illustrative sample from: '+tr(screen.title)+'.']);
      document.getElementById('detail-fields').innerHTML=screen.columns.map((column,index)=>`<div class="detail-field"><dt>${escapeHtml(tr(column))}</dt><dd>${escapeHtml(tr(row[index]))}</dd></div>`).join('');
      document.getElementById('record-detail').hidden=false;
    }
    document.getElementById('language-toggle').addEventListener('click',(event)=>{englishMode=!englishMode;document.body.classList.toggle('show-en',englishMode);event.currentTarget.textContent=englishMode?'VI':'EN';search.placeholder=tr(['Tìm mã hoặc nội dung','Search IDs or text']);search.setAttribute('aria-label',tr(['Tìm bản ghi đang hiển thị','Search displayed records']));renderScreen();});
    search.addEventListener('input',renderRows);
    statusFilter.addEventListener('change',renderRows);
    renderScreen();
  </script>
  <script src="scripts/document_language.js" defer></script>
</body>
