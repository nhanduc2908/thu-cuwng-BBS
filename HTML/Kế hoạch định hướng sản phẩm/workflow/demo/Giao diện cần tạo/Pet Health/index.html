  <div id="demoApp" role="region" aria-label="Ứng dụng Pet Health · Tổng quan y tế" aria-busy="true" tabindex="-1">

  <noscript>
    <main class="demo-noscript-page">
      <header>
        <span class="workspace-kicker">PET HEALTH · WAGGY SYSTEMS</span>
        <h1>Tổng quan y tế</h1>
        <p>Hàng đợi chuyên môn và các cổng an toàn cần theo dõi.</p>
      </header>
      <section aria-labelledby="noscript-steps">
        <h2 id="noscript-steps">Các bước rà soát</h2>
        <ol>
          <li>Xác định đúng phạm vi dữ liệu, cơ sở và mục tiêu của màn hình Tổng quan y tế.</li>
          <li>Đối chiếu nguồn, trạng thái và thông tin liên quan trước khi xử lý ngoại lệ.</li>
          <li>Kiểm tra cảnh báo và thẩm quyền; chuyển người phụ trách nếu thiếu căn cứ hoặc quyền phê duyệt.</li>
          <li>Ghi nhận kết quả, người xử lý và bước tiếp theo trong quy trình phù hợp.</li>
        </ol>
      </section>
      <section aria-labelledby="noscript-principles">
        <h2 id="noscript-principles">Nguyên tắc sử dụng</h2>
        <p>Nội dung trên màn hình là dữ liệu sandbox minh họa. Xác minh thông tin trên hệ thống có thẩm quyền trước khi đưa ra quyết định hoặc cập nhật nghiệp vụ thật.</p>
      </section>
      <nav aria-label="Màn hình liên quan">
