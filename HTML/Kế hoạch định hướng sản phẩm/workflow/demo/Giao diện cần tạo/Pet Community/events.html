        <p>Quản lý hoạt động cộng đồng và đăng ký mẫu.</p>

      <section aria-labelledby="noscript-steps">

        <ol>
          <li>Xác định đúng phạm vi dữ liệu, cơ sở và mục tiêu của màn hình Sự kiện.</li>
          <li>Đối chiếu nguồn, trạng thái và thông tin liên quan trước khi xử lý ngoại lệ.</li>
          <li>Kiểm tra cảnh báo và thẩm quyền; chuyển người phụ trách nếu thiếu căn cứ hoặc quyền phê duyệt.</li>
          <li>Ghi nhận kết quả, người xử lý và bước tiếp theo trong quy trình phù hợp.</li>
        </ol>
      </section>
      <section aria-labelledby="noscript-principles">

        <p>Nội dung trên màn hình là dữ liệu sandbox minh họa. Xác minh thông tin trên hệ thống có thẩm quyền trước khi đưa ra quyết định hoặc cập nhật nghiệp vụ thật.</p>
      </section>
