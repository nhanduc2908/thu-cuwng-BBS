      <header><span class="workspace-kicker">PROCUREMENT · REQUISITION TO PO DRAFT</span><h1>Đề nghị mua hàng</h1><p>Tính nhu cầu theo tồn khả dụng, lead time, safety stock và đơn đang mở; kiểm nhà cung cấp, báo giá và ngân sách.</p></header>
      <section><h2>Quy trình mua hàng</h2><ol><li>Tính suggested quantity sau khi trừ tồn khả dụng và hàng đang đặt.</li><li>Áp MOQ/quy cách đóng gói và tham chiếu vendor đủ điều kiện.</li><li>So chi phí dự kiến với ngân sách và policy version.</li><li>Gửi checker độc lập; chỉ tạo PO draft sau khi duyệt.</li></ol></section>
      <section><h2>Điều kiện chặn</h2><p>Thiếu báo giá, vượt ngân sách hoặc maker trùng checker phải giữ ở trạng thái chờ. Không tự gửi đơn mua hay cam kết thanh toán.</p></section>
