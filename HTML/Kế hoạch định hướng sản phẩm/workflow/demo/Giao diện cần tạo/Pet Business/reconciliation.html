      <section><h2>Quy trình đối soát</h2><ol><li>Chụp nguồn và chuẩn hóa timezone/đơn vị.</li><li>Ghép exact reference trước; không tái sử dụng cùng một dòng.</li><li>Tính residual theo tolerance đã cấu hình.</li><li>Chuyển fuzzy candidate và unmatched sang review queue.</li></ol></section>
