  <noscript>
    <main class="demo-noscript-page">
      <header><span class="workspace-kicker">RECEIVING · THREE-WAY MATCH</span><h1>Nhập hàng &amp; xác minh receipt</h1><p>Đối chiếu purchase order, số giao/nhận, hàng bị từ chối và hóa đơn trước khi xem xét tăng tồn hoặc ghi công nợ.</p></header>
      <section><h2>Quy trình nhận hàng</h2><ol><li>Xác minh PO, chi nhánh nhận và dòng hàng.</li><li>Ghi số lượng, lô, hạn dùng và tình trạng chất lượng.</li><li>So qty/đơn giá trên PO với receipt và invoice.</li><li>Checker xác nhận; cách ly sai lệch trước khi cập nhật sổ.</li></ol></section>
      <section><h2>Điều kiện chặn</h2><p>Thiếu invoice, sai unit mapping, lô không hợp lệ hoặc variance vượt tolerance phải được rà soát; không tự cộng tồn.</p></section>
